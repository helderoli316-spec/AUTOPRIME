<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Prime | Anúncio</title>

    <style>
        :root {
            --fundo: #0a0a0c;
            --painel: #141418;
            --borda: #26262c;
            --texto: #f2f2f4;
            --suave: #9a9aa4;
            --vermelho: #ed142b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--fundo);
            color: var(--texto);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }

        header {
            border-bottom: 1px solid var(--borda);
            padding: 18px 24px;
        }

        header a {
            color: var(--texto);
            text-decoration: none;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 1px;
        }

        header a span { color: var(--vermelho); }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        .voltar {
            display: inline-block;
            color: var(--suave);
            text-decoration: none;
            margin-bottom: 24px;
        }

        .voltar:hover,
        .voltar:focus-visible { color: var(--texto); }

        .anuncio {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 32px;
            align-items: start;
        }

        .foto {
            background: var(--painel);
            border: 1px solid var(--borda);
            border-radius: 6px;
            overflow: hidden;
        }

        .foto img {
            display: block;
            width: 100%;
            height: auto;
        }

        .dados {
            background: var(--painel);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 28px;
        }

        .dados h1 { font-size: 28px; line-height: 1.2; }

        .versao { color: var(--suave); margin-top: 6px; }
