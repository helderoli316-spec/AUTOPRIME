<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Meu perfil | Auto Prime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <a href="/" class="logo">

            <div class="logo-name">
                AUTO<span>PRIME</span>
            </div>

            <small>
                SONHOS EM MOVIMENTO
            </small>

        </a>

        <div class="header-actions">

            <a href="/" class="login back-link">← Voltar ao site</a>

            <button class="register" id="logout">Sair</button>

        </div>

    </header>


    <main class="profile">

        <div class="eyebrow"><span></span> MINHA CONTA</div>

        <h1 class="profile-title">
            MEU <strong>PERFIL</strong>
        </h1>

        <p class="profile-status" id="status">Carregando...</p>


        <!-- ============ DADOS DO USUÁRIO ============ -->

        <section class="panel user-card" id="userCard" hidden>

            <div class="avatar-area">

                <div class="avatar-big" id="avatarBig">
                    <img id="avatarPhoto" alt="Sua foto de perfil" hidden>
                    <span id="avatarLetter"></span>
                </div>

                <label class="btn-outline" for="avatarFile">Escolher foto</label>
                <input type="file" id="avatarFile" accept="image/*" hidden>

                <button type="button" class="btn-link" id="avatarRemove" hidden>Remover foto</button>

                <p class="avatar-msg" id="avatarMsg"></p>

            </div>

            <dl class="info">

                <div>
                    <dt>Nome</dt>
                    <dd id="infoName"></dd>
                </div>

                <div>
                    <dt>E-mail</dt>
                    <dd id="infoEmail"></dd>
                </div>

                <div>
                    <dt>Telefone de contato</dt>
                    <dd id="infoPhone"></dd>
                </div>

                <div>
                    <dt>Cliente desde</dt>
                    <dd id="infoSince"></dd>
                </div>

            </dl>

        </section>


        <!-- ============ ABAS ============ -->

        <section class="panel" id="tabsPanel" hidden>

            <div class="tabs" role="tablist">

                <button class="tab active" data-tab="purchases" role="tab">
                    Carros comprados <b id="countPurchases">0</b>
                </button>

                <button class="tab" data-tab="favorites" role="tab">
                    Favoritos <b id="countFavorites">0</b>
                </button>

                <button class="tab" data-tab="listings" role="tab">
                    Estou vendendo <b id="countListings">0</b>
                </button>

            </div>


            <div class="tab-panel" id="tab-purchases">
                <div class="cars-list" id="listPurchases"></div>
            </div>


            <div class="tab-panel" id="tab-favorites" hidden>
                <div class="cars-list" id="listFavorites"></div>
            </div>


            <div class="tab-panel" id="tab-listings" hidden>

                <button type="button" class="btn-red" id="toggleSell">+ Anunciar um carro</button>

                <form id="sellForm" class="sell-form" hidden novalidate>

                    <label>Modelo
                        <input type="text" id="sellName" maxlength="80" placeholder="Ex.: Honda Civic Touring">
                    </label>

                    <label>Versão
                        <input type="text" id="sellVersion" maxlength="60" placeholder="Ex.: 1.5 Turbo CVT">
                    </label>

                    <div class="sell-row">

                        <label>Ano
                            <input type="number" id="sellYear" inputmode="numeric" placeholder="2022">
                        </label>

                        <label>Km
                            <input type="number" id="sellKm" inputmode="numeric" min="0" placeholder="35000">
                        </label>

                        <label>Preço (R$)
                            <input type="number" id="sellPrice" inputmode="numeric" min="0" placeholder="159900">
                        </label>

                    </div>

                    <button type="submit" class="btn-red">Publicar anúncio</button>

                    <p class="sell-msg" id="sellMsg"></p>

                </form>

                <div class="cars-list" id="listListings"></div>

            </div>

        </section>

    </main>


    <footer>

        <span>⌖ Fortaleza - CE</span>

        <span>Auto Prime · Minha conta</span>

        <span>Área do cliente</span>

    </footer>


    <script src="perfil.js"></script>

</body>

</html>
